[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-session-bridge"
version = "0.1.0"
description = "Cross-tool AI conversation history reader. Enables any AI coding agent to access conversation history from other AI tools."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Furkan Yıldız", email = "furkan_yildiz@msn.com"},
]
keywords = [
    "ai",
    "mcp",
    "copilot",
    "cursor",
    "rovodev",
    "conversation-history",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "click>=8.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.scripts]
ai-session-bridge = "ai_session_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/frknyldz/ai-session-bridge"
Repository = "https://github.com/frknyldz/ai-session-bridge"
Issues = "https://github.com/frknyldz/ai-session-bridge/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long - allow some flexibility

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
